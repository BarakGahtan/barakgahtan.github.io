themes:
  - title: "What transformers actually compute"
    text: >-
      Calibration-free diagnostics that audit a model instead of trusting its headline scores: how much of its depth
      is distinct computation, whether a personalized model conditions on the user at all, and where pre-scoring
      query-key geometry helps attention.
    papers:
      - { title: "Effective depth", url: /publication/12 }
      - { title: "The shuffle gap", url: /publication/13 }
      - { title: "Coupled query-key dynamics", url: /publication/14 }
  - title: "Differentiable physics and inverse problems"
    text: >-
      Classical solvers kept inside the learning loop. Implicit differentiation through fast sweeping turns
      anisotropic Eikonal distance fields into trainable models of wildfire spread.
    papers:
      - { title: "Randers-Finsler eikonal solvers", url: /publication/11 }
  - title: "Physiology from low-friction signals"
    text: >-
      Instantaneous VO₂ and cardiovascular load estimated from smartwatches, chest straps and monocular 3D pose in
      video, with neural ODE and Kalman structure and four datasets collected in the field.
    papers:
      - { title: "From Lab to Wrist", url: /publication/9 }
      - { title: "WearableMil", url: /publication/4 }
      - { title: "Cardiovascular drift from 3D pose", url: /publication/15 }
  - title: "Encrypted network traffic as time series"
    text: >-
      QUIC traces rendered as image sequences and multi-operator cellular links as multivariate series, from a
      100,000-trace public dataset to real-time network selection for teleoperated vehicles.
    papers:
      - { title: "VisQUIC", url: /publication/5 }
      - { title: "HTTP/3 response estimation", url: /publication/3 }
      - { title: "Active Network Selector", url: /publication/2 }
