eyebrow: "Deep learning researcher · PhD, Technion (2026)"
headline: "I study what deep models actually compute, and how to build physical and physiological structure into them."
lede: >-
  My research is about deep learning for real-world temporal and spatiotemporal data: signals that are noisy, partly
  missing, and collected far from the lab. I bring the structure of the domain, whether physiology, physics, or
  network behavior, into modern models so they are not only accurate but interpretable and reliable, and I apply the
  same lens to large language models, asking what they actually compute rather than trusting their headline scores.
  I completed my PhD at the Technion in 2026 with Alex Bronstein and Reuven Cohen, and spent 2026 as an independent
  contractor with Apple's Video Engineering group.
status: "Open to research scientist and applied scientist roles in LLM understanding, physics-informed AI and sensing."
