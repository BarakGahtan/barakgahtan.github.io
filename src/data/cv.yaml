name: Barak Gahtan
tagline: AI Researcher · PhD, Technion (2026) · Tel Aviv, Israel
summary: >-
  AI Researcher at a stealth company, working on LLM inference and post-training, with a PhD from the Technion (2026)
  on models for signals that are hard to measure:
  physiological state from wearables and video, physical spread processes, and the internals of language models.
  Produced the first instantaneous VO₂ estimates from a consumer smartwatch (ACM ICMI 2025, oral), extended them
  to 3D human pose in video as an independent contractor with Apple's Video Engineering group, made eikonal PDE
  solvers differentiable (SGP 2026), and wrote two first-author ACML 2026 papers on what transformers actually
  compute. Author of 13 papers, 12 as first author; reviewer for ACM ICMI and IEEE venues.
methods: State-space and temporal modeling, Kalman filtering, neural ODEs, differentiable PDE solvers, physics-informed deep learning, LLM analysis, signal processing.
tools: Python, PyTorch, CUDA, DDP, Slurm, Hugging Face, NumPy, pandas, Linux, Git.
