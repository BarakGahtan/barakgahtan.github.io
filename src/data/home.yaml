eyebrow: PhD, Technion (2026)
headline: Deep learning researcher
# One string per paragraph: what I do now first, then the range of the PhD work.
lede:
  - "I currently work on LLM inference and post-training as an AI Researcher at a stealth company."
  - "During my PhD at the Technion (2026), with Alex Bronstein and Reuven Cohen, I worked on a wide range of problems: instantaneous VO₂ from smartwatches and from 3D pose in video, differentiable eikonal solvers for wildfire spread, encrypted network traffic as time series, and diagnostics of what large language models actually compute. The common thread was real-world data that is noisy, partly missing, and collected far from the lab, and models that build in the structure of the domain. From May to October 2026 I worked as an independent contractor with Apple's Video Engineering group."
